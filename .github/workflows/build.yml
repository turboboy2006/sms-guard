name: Build APK

# Builds a debug APK in the cloud so no Android Studio / SDK is needed locally.
# Download the result from the run's "Artifacts" section.

on:
  # APKs are intentionally built only when manually requested. This keeps
  # ordinary code changes from publishing/building an installable package.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        run: |
          set -e
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Show toolchain (helps debugging)
        run: |
          java -version
          gradle --version

      - name: Restore stable signing key
        env:
          SIGNING_KEY: ${{ secrets.SMS_GUARD_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/smsguard-release.p12"

      - name: Build debug APK
        env:
          SMS_GUARD_KEYSTORE: ${{ runner.temp }}/smsguard-release.p12
          SMS_GUARD_STORE_PASSWORD: ${{ secrets.SMS_GUARD_STORE_PASSWORD }}
          SMS_GUARD_KEY_ALIAS: ${{ secrets.SMS_GUARD_KEY_ALIAS }}
          SMS_GUARD_KEY_PASSWORD: ${{ secrets.SMS_GUARD_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-guard-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
