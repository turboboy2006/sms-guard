name: Detector

# فایل تکِ SpamDetector.kt را با کامپایلر واقعی Kotlin کامپایل می‌کند،
# خودآزمایی داخلی را اجرا می‌کند و یک JAR قابل‌اجرا برای استفاده روی دسکتاپ می‌سازد.
# (روی ویندوز بدون JDK/Kotlin هم می‌توان JAR را از Artifacts گرفت و با java اجرا کرد.)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'detector/**'
      - '.github/workflows/detector.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Kotlin compiler 1.9.24
        run: |
          set -e
          curl -sSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip
          unzip -q /tmp/kotlin.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          java -version
          kotlinc -version

      - name: Compile detector (single file)
        run: |
          set -e
          kotlinc detector/SpamDetector.kt -include-runtime -d detector.jar -J-Xmx3g
          ls -lh detector.jar

      - name: Run built-in self-test
        run: |
          set -e
          java -cp detector.jar ir.inod.smsguard.intel.SpamDetectorKt --self-test

      - name: CLI smoke test
        run: |
          set -e
          printf 'Bank Melli\tبانک ملی | کد 42123 را جهت ورود به سامانه بام وارد نمایید\n09123305886\tسلام امید جان\n50003401402414\tکاربر گرامی افراک | سفارش شما به شماره رهگیری 309597 به وضعیت در حال انجام تغییر یافت.\n98500027100\tآخرین فرصت! + 60,000,000 ریال اعتبار پیامکی هدیه | فقط تا امشب | mlps.ir/x | لغو11\n' > /tmp/in.txt
          java -cp detector.jar ir.inod.smsguard.intel.SpamDetectorKt < /tmp/in.txt

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: spam-detector-jar
          path: detector.jar
          retention-days: 30
